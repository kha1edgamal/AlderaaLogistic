<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c687"/>
      <stop offset="50%" stop-color="#cba25d"/>
      <stop offset="100%" stop-color="#b08a44"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#b0b4ba"/>
    </linearGradient>
  </defs>
  <!-- Shield -->
  <path d="M100 12 L170 38 V100 C170 148 135 178 100 188 C65 178 30 148 30 100 V38 Z"
        fill="#0d2335" stroke="url(#goldGrad)" stroke-width="4"/>
  <path d="M100 22 L160 45 V100 C160 142 130 168 100 177 C70 168 40 142 40 100 V45 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
  <!-- Truck body -->
  <g>
    <!-- Cargo box -->
    <rect x="55" y="70" width="55" height="42" rx="2" fill="url(#silverGrad)" stroke="#cba25d" stroke-width="2"/>
    <!-- Cab -->
    <path d="M110 82 L120 70 L145 70 L150 82 L150 112 L110 112 Z"
          fill="url(#silverGrad)" stroke="#cba25d" stroke-width="2"/>
    <!-- Window -->
    <path d="M118 82 L124 75 L143 75 L143 95 L118 95 Z" fill="#0d2335" opacity="0.85"/>
    <!-- Door line -->
    <line x1="122" y1="95" x2="122" y2="112" stroke="#0d2335" stroke-width="1.5"/>
    <!-- Wheels -->
    <circle cx="72" cy="116" r="9" fill="#0d2335" stroke="#cba25d" stroke-width="2"/>
    <circle cx="72" cy="116" r="3.5" fill="#cba25d"/>
    <circle cx="95" cy="116" r="9" fill="#0d2335" stroke="#cba25d" stroke-width="2"/>
    <circle cx="95" cy="116" r="3.5" fill="#cba25d"/>
    <circle cx="138" cy="116" r="9" fill="#0d2335" stroke="#cba25d" stroke-width="2"/>
    <circle cx="138" cy="116" r="3.5" fill="#cba25d"/>
    <!-- Lines on cargo -->
    <line x1="70" y1="78" x2="70" y2="105" stroke="#0d2335" stroke-width="1.2" opacity="0.5"/>
    <line x1="85" y1="78" x2="85" y2="105" stroke="#0d2335" stroke-width="1.2" opacity="0.5"/>
  </g>
</svg>
